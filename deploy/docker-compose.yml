# Run from the deploy/ directory:  docker compose up -d --build
# Compose reads deploy/.env automatically (copy .env.example to .env and fill it in).
#
# This stack has no web server of its own: HTTPS, the static frontend and routing to the API
# are handled by a separate edge proxy project (Caddy) that owns ports 80/443 on the server.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No "ports:" on purpose: the database is only reachable from other containers.

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      # Drives CORS, OAuth redirects and links in emails.
      FRONTEND_URL: https://${DOMAIN}
    # "expose" is container-to-container only; the shared edge proxy (~/edge) is the single
    # public entry point and reaches this service as autolog-backend:8080 over edge_autolog.
    expose:
      - "8080"
    networks:
      default:
      edge_autolog:
        aliases:
          - autolog-backend

volumes:
  pgdata:

networks:
  # Created once on the host:  docker network create edge_autolog
  # Only the edge proxy and this backend are attached to it; the database is not.
  edge_autolog:
    external: true
