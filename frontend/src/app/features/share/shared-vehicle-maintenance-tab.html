<div class="maintenance-tab">
  @if (error()) {
    <p class="status-message error">{{ error() }}</p>
  } @else {
    <app-maintenance-list
      [records]="serviceRecords()"
      titleKeyPrefix="sharedVehicle.maintenanceTab"
      [showAddButton]="false"
      (recordSelected)="openRecordDetails($event)"
    >
    </app-maintenance-list>
  }

  @if (isModalOpen()) {
    <app-modal [style.--modal-width]="'min(560px, calc(100vw - 32px))'" (closed)="closeModal()">
      @if (selectedRecord(); as record) {
        <h2>{{ 'sharedVehicle.maintenanceTab.detailsTitle' | translate }}</h2>

        <app-maintenance-record-details
          [record]="record"
          [hasMileageWarning]="hasMileageWarning(record)"
        >
        </app-maintenance-record-details>

        <div class="modal-actions">
          <button type="button" class="secondary-btn" (click)="closeModal()">
            {{ 'common.close' | translate }}
          </button>
        </div>
      }
    </app-modal>
  }
</div>
