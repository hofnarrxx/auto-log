<nav class="navbar">
  <div class="logo">{{ 'common.appName' | translate }}</div>

  @if (isVehicleDashboardPage() && currentVehicleId()) {
  <div class="vehicle-navbar-tabs">
    <a
      [routerLink]="['/vehicles', currentVehicleId()]"
      [queryParams]="{ tab: 'details' }"
      [class.active]="isVehicleTabActive('details')">
      {{ 'nav.details' | translate }}
    </a>
    <a
      [routerLink]="['/vehicles', currentVehicleId()]"
      [queryParams]="{ tab: 'maintenance' }"
      [class.active]="isVehicleTabActive('maintenance')">
      {{ 'nav.maintenance' | translate }}
    </a>
    <a
      [routerLink]="['/vehicles', currentVehicleId()]"
      [queryParams]="{ tab: 'fuel' }"
      [class.active]="isVehicleTabActive('fuel')">
      {{ 'nav.fuel' | translate }}
    </a>
  </div>
  }

  <div class="profile" (click)="toggleMenu($event)">
    <button type="button" class="profile-btn" [attr.aria-expanded]="menuOpen()"> {{ 'nav.profile' | translate }} </button>
    @if (menuOpen()) {
    <div class="dropdown">
      <a routerLink="/dashboard" (click)="closeMenu()">{{ 'nav.myCars' | translate }}</a>
      <a routerLink="/settings" (click)="closeMenu()">{{ 'nav.settings' | translate }}</a>
      <button type="button" class="dropdown-logout" (click)="logout()">{{ 'nav.logout' | translate }}</button>
    </div>
    }
  </div>
</nav>

<div class="content">
  <router-outlet></router-outlet>
</div>
