<div class="settings-container">
  <h1>{{ 'settings.title' | translate }}</h1>

  <div class="settings-section">
    <label for="language-select">{{ 'settings.selectLanguage' | translate }}</label>
    <select
      id="language-select"
      [ngModel]="selectedLanguage()"
      (ngModelChange)="onLanguageChange($event)"
    >
      @for (language of languages; track language.code) {
        <option [value]="language.code">{{ language.label }}</option>
      }
    </select>
  </div>

  <div class="settings-section">
    <label for="currency-select">{{ 'common.selectCurrency' | translate }}</label>
    <select
      id="currency-select"
      [ngModel]="selectedCurrency()"
      (ngModelChange)="onCurrencyChange($event)"
    >
      @for (currency of currencies; track currency) {
        <option [value]="currency">{{ currency }}</option>
      }
    </select>
  </div>

  @if (!isDemo()) {
    <div class="settings-section password-section">
      <span class="settings-label">{{ 'settings.password.title' | translate }}</span>
      <button type="button" class="password-open-btn" (click)="openPasswordModal()">
        {{
          (hasLocalLogin() ? 'settings.password.changeSubmit' : 'settings.password.setSubmit')
            | translate
        }}
      </button>
    </div>
  }
</div>

@if (isPasswordModalOpen() && !isDemo()) {
  <app-password-modal (closed)="closePasswordModal()" />
}
