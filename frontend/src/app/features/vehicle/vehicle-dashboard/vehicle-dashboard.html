@if (vehicle()) {
  <div class="dashboard-container">
    <div class="tab-content">
      @if (activeTab() === 'details') {
        <app-vehicle-details-tab
          [vehicle]="vehicle()!"
          (editRequested)="openEdit()"
          (shareRequested)="openShareModal()"
          (deleteRequested)="deleteVehicle()"
        >
        </app-vehicle-details-tab>
      }

      @if (activeTab() === 'maintenance') {
        <app-vehicle-maintenance-tab [vehicleId]="vehicle()!.id"></app-vehicle-maintenance-tab>
      }

      @if (activeTab() === 'fuel') {
        <app-vehicle-fuel-tab [vehicleId]="vehicle()!.id"></app-vehicle-fuel-tab>
      }
    </div>
  </div>

  @if (showEditModal()) {
    <app-modal (closed)="closeEditModal()">
      <app-vehicle-form [vehicle]="vehicle()" (closed)="closeEditModal()"> </app-vehicle-form>
    </app-modal>
  }

  @if (showShareModal()) {
    <app-share-link-modal [vehicleId]="vehicle()!.id" (closed)="closeShareModal()">
    </app-share-link-modal>
  }
} @else {
  <p>{{ 'common.vehicleNotFound' | translate }}</p>
}
