<nav class="navbar">
  <div class="logo">AutoLog</div>

  @if (isVehicleDashboardPage() && currentVehicleId()) {
  <div class="vehicle-navbar-tabs">
    <a
      [routerLink]="['/vehicles', currentVehicleId()]"
      [queryParams]="{ tab: 'details' }"
      [class.active]="isVehicleTabActive('details')">
      Details
    </a>
    <a
      [routerLink]="['/vehicles', currentVehicleId()]"
      [queryParams]="{ tab: 'maintenance' }"
      [class.active]="isVehicleTabActive('maintenance')">
      Maintenance
    </a>
    <a
      [routerLink]="['/vehicles', currentVehicleId()]"
      [queryParams]="{ tab: 'fuel' }"
      [class.active]="isVehicleTabActive('fuel')">
      Fuel
    </a>
  </div>
  }

  <div class="profile" (click)="toggleMenu($event)">
    <button type="button" class="profile-btn" [attr.aria-expanded]="menuOpen()"> Profile </button>
    @if (menuOpen()) {
    <div class="dropdown">
      <a routerLink="/dashboard" (click)="closeMenu()">My Cars</a>
      <a routerLink="/settings" (click)="closeMenu()">Settings</a>
      <button type="button" class="dropdown-logout" (click)="logout()">Log Out</button>
    </div>
    }
  </div>
</nav>

<div class="content">
  <router-outlet></router-outlet>
</div>
